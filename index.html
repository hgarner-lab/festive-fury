 lobs.push({x:sx,y:e.y,z:z0,vz,vx:(tg.x-sx)/T,vy:(tg.y-e.y)/T,tx:tg.x,ty:tg.y,k,dmg:{dyn:18,bomb:16,present:14,bauble:18}[k]||14,spin:0});e.atk=18;e.atype='punch';sfx('throw')}

 const K=pl.k,tp=n=>tap(K[n]);
 if(pl.dead){pl.dead--;if(pl.dead==0){if(pl.lives>0){pl.hp=100;pl.inv=150;pl.z=160;pl.vz=0;fx.push({x:pl.x,y:pl.y-140,t:30,txt:'GO!'})}else pl.out=1}return}
 const dx=(keys[K[1]]?1:0)-(keys[K[0]]?1:0),dy=(keys[K[3]]?1:0)-(keys[K[2]]?1:0),sp=4;
 pl.moving=0;if(pl.chainT>0)pl.chainT--;

  else if(G.hits>=3||G.t<=0||tp(5))throwFoe(pl);

 else if(pl.atk<=0){pl.x+=dx*sp;pl.y+=dy*3;if(dx)pl.f=dx;if(dx||dy){pl.walk++;pl.moving=1}

  else if(pl.carry&&tp(4)){pl.carry=null;pl.atk=16;pl.atype='throw';sfx('throw');pthrows.push({x:pl.x+pl.f*24,y:pl.y,z:70,vx:pl.f*10,vz:2.5,f:pl.f,spin:0,hitList:[]})}

 else{pl.atk--;

function tone(f0,f1,dur,type='square',vol=.15,when){if(!ac)return;when=when||ac.currentTime;const o=ac.createOscillator(),gn=ac.createGain();o.type=type;
 o.frequency.setValueAtTime(f0,when);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),when+dur);
 gn.gain.setValueAtTime(vol,when);gn.gain.exponentialRampToValueAtTime(.001,when+dur);o.connect(gn);gn.connect(master);o.start(when);o.stop(when+dur+.02)}

 gn.gain.setValueAtTime(vol,when);gn.gain.exponentialRampToValueAtTime(.001,when+dur);s.connect(f);f.connect(gn);gn.connect(master);s.start(when);s.stop(when+dur+.02)}

 case'hurt':tone(420,140,.22,'sawtooth',.12);break;

 case'throw':noise(.22,'bandpass',300,1600,.2);break;
 case'grab':tone(180,240,.07,'square',.1);break;
 case'thud':noise(.25,'lowpass',400,60,.5);tone(90,40,.2,'sine',.3);break;
 case'boom':noise(.7,'lowpass',900,60,.7);tone(110,30,.5,'sine',.4);break;
 case'ice':tone(1400,2000,.12,'triangle',.1);break;
 case'whip':noise(.13,'highpass',2500,6000,.25);break;
 case'bell':tone(1568,1568,.5,'triangle',.12);tone(2093,2093,.4,'triangle',.08,t+.05);break;
 case'bridge':tone(55,45,1.6,'square',.06);noise(1.6,'lowpass',200,120,.15);[0,.5,1].forEach(d=>tone(880,880,.25,'square',.05,t+d));break;
 case'dialog':noise(.14,'bandpass',500,2600,.12);tone(mf(79),mf(79),.07,'square',.07,t+.05);tone(mf(84),mf(84),.07,'square',.07,t+.11);tone(mf(91),mf(91),.16,'triangle',.1,t+.17);break;

 case'glass':for(let i=0;i<6;i++)tone(2400+Math.random()*1800,1800,.12,'triangle',.05,t+i*.03);noise(.4,'highpass',4000,7000,.2);break;
 case'sting':[[48,.0],[51,.0],[55,.0],[47,.35],[50,.35],[54,.35]].forEach(([n,d])=>tone(mf(n),mf(n),.6,'sawtooth',.07,t+d));tone(60,40,1,'sine',.3,t);break;
 case'wind':noise(1.2,'bandpass',400,1800,.18);break;
 case'freeze':noise(.5,'highpass',3000,9000,.3);[88,91,95,100].forEach((k,i)=>tone(mf(k),mf(k),.25,'triangle',.07,t+i*.05));tone(200,60,.4,'sine',.3);break;
 case'flicker':[0,.06,.14].forEach(d=>noise(.04,'highpass',5000,5000,.12,t+d));tone(60,60,.25,'sawtooth',.05);break;
 case'chains':for(let i=0;i<5;i++){noise(.05,'bandpass',3200+Math.random()*1500,3200,.18,t+i*.07);tone(1900+Math.random()*900,1600,.06,'triangle',.04,t+i*.07)};break;
 case'bong':tone(98,96,1.6,'sine',.35);tone(196,194,1.2,'triangle',.12);tone(587,585,.9,'sine',.06);tone(1175,1170,.6,'sine',.03);break;
 case'screech':tone(1400,700,.8,'sawtooth',.06);noise(.8,'bandpass',2500,1200,.15);break;
 case'glint':tone(mf(96),mf(103),.12,'triangle',.1);tone(mf(108),mf(108),.15,'triangle',.06,t+.08);break;
 case'cackle':for(let i=0;i<6;i++)tone(900+(i%2)*500,700+(i%2)*400,.07,'square',.06,t+i*.08);break;
 case'leap':tone(90,260,.35,'sawtooth',.12);noise(.3,'lowpass',300,900,.2);break;
 case'charge':tone(200,1400,.75,'sawtooth',.06);tone(203,1410,.75,'square',.04);break;
 case'laser':tone(1800,500,.6,'sawtooth',.1);tone(900,300,.6,'square',.06);noise(.6,'bandpass',3000,1200,.15);break;
 case'pop':tone(mf(84),mf(91),.06,'square',.06);tone(mf(96),mf(96),.08,'triangle',.08,t+.06);break;

  while(tr.t<ahead){const[n,b]=tr.seq[tr.i],d=b*60/tempo;
   if(tr.perc=='bells'){noise(.08,'highpass',7000,7000,.05,tr.t);if(tr.i%2)noise(.05,'highpass',9000,9000,.03,tr.t+d/2)}
   else if(tr.perc=='drum'){if(tr.i%2==0)tone(120,45,.15,'sine',.25,tr.t);else noise(.1,'bandpass',1800,1800,.12,tr.t)}
   else if(n)tone(mf(n+tr.o),mf(n+tr.o),Math.max(.05,d*.85),tr.w,tr.v,tr.t);
   tr.t+=d;tr.i=(tr.i+1)%tr.seq.length}})}

  const l=Math.min(1,40/Math.max(1,Math.hypot(dx,dy)));knob.style.transform=`translate(${dx*l}px,${dy*l}px)`};
 const padEv=e=>{const r=pad.getBoundingClientRect();padSet(e.clientX-r.left-r.width/2,e.clientY-r.top-r.height/2)};
 pad.addEventListener('pointerdown',e=>{initAudio();try{pad.setPointerCapture(e.pointerId)}catch(_){}padEv(e);e.preventDefault()});
